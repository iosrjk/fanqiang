name: Update client release links

on:
  schedule:
    # Every day at 03:15 UTC (11:15 Beijing / 10:15 Vietnam)
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check latest GitHub Releases
        run: python scripts/update_releases.py

      - name: Commit updated links
        run: |
          if git diff --quiet -- download.md; then
            echo "No release link changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download.md
          git commit -m "chore: update client release links"
          git push
